<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{/* Minimal demo styling; a real site would use its own theme. */}}
  <style>
    body { font: 16px/1.65 ui-sans-serif, system-ui, sans-serif; margin: 0; color: #232323; background: #fdfdfd; }
    header { border-bottom: 1px solid #ddd; padding: 1rem 1.25rem; font-weight: 600; }
    header a { color: inherit; text-decoration: none; }
    main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    h1 { font-size: 1.6rem; }
    ul.posts { list-style: none; padding: 0; }
    ul.posts li { padding: .25rem 0; }
  </style>
  {{ partial "pi-replay-head.html" . }}
</head>
<body>
  <header><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
